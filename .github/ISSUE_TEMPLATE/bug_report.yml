name: 🐞 Bug
description: Algo não funciona como deveria no JADÁ.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar! Antes de enviar, veja se já existe uma issue parecida.
        **Falhas de segurança não devem ser reportadas aqui.** Siga o [SECURITY.md](https://github.com/paulohenz/jada/blob/main/SECURITY.md).
  - type: textarea
    id: descricao
    attributes:
      label: O que aconteceu?
      description: Descreva o problema de forma clara.
      placeholder: Ao tocar em "Informar fila" na página do local, o botão não responde.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passo a passo para reproduzir
      placeholder: |
        1. Abrir a página do local ...
        2. Tocar em ...
        3. Ver o erro ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que você esperava que acontecesse?
    validations:
      required: true
  - type: dropdown
    id: pagina
    attributes:
      label: Onde aconteceu?
      options:
        - Início / busca
        - Página do local
        - Informar fila / confirmar / denunciar
        - Mapa
        - Minha seção
        - Como funciona / Sobre
        - Outro
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link da página (se houver)
      placeholder: https://...
  - type: input
    id: ambiente
    attributes:
      label: Aparelho, sistema e navegador
      placeholder: "iPhone 13, iOS 18, Safari / Notebook, Windows 11, Chrome 141"
    validations:
      required: true
  - type: textarea
    id: anexos
    attributes:
      label: Prints ou vídeo
      description: Arraste imagens ou vídeos para cá. Não inclua dados pessoais.
